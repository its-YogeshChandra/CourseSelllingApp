# ============================================================
# Docker Compose - Course Selling App
# ============================================================
# Architecture: auto-detected (works on both amd64 and arm64)
# Services:
#   1. backend   - Node.js API server (Express)
#   2. frontend  - Vite React app (served via nginx)
#   3. nginx     - Reverse proxy with SSL termination
#   4. certbot   - Automatic SSL certificate renewal
#
# MongoDB is external (Atlas), NOT containerised here.
# ============================================================

services:
  # ---- Backend API ----
  backend:

    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: courseselling-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # Dynamic CORS whitelist — set to your production domain
      - ALLOWED_ORIGINS=https://yourdomain.com,https://www.yourdomain.com
    volumes:
      # Persist uploaded files between container restarts
      - backend_uploads:/app/public/temp
      - backend_chunks:/app/public/chunkPlaylist
    networks:
      - app-network
    # No port exposed to host — nginx handles external traffic
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M

  # ---- Frontend (built + served by internal nginx) ----
  frontend:

    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # All Vite env vars must be supplied at BUILD time
        # In production, the frontend talks to the SAME domain (nginx proxies /api)
        VITE_LOGIN_USER: /api/v1/users/login
        VITE_SIGNUP_USER: /api/v1/users/signup
        VITE_GOOGLE_USER: /api/v1/users/googleLogin
        VITE_AUTHME_URL: /api/v1/users/authme
        VITE_COURSE_URL: /api/v1/course/createcourse
        VITE_LESSON_URL: /api/v1/course/uploadlessons
        VITE_GETCOURSE_URL: /api/v1/course/getCourseData
        VITE_GETCOURSE_LESSONS_URL: /api/v1/course/getCourseAndLessonData
        VITE_ISPRESENT_URL: /api/v1/course/isSubscribed
        VITE_ADDSUBSCRIPTION_URL: /api/v1/course/addStudentToCourse
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
        VITE_COURSE_ADDTOCOMPLETION_URL: /api/v1/users/addtocompletion
        VITE_COURSE_CHECKCOMPLETION_URL: /api/v1/users/completioncheck
        VITE_FINDUSER_URL: /api/v1/users/findUser
        VITE_UPDATEPASSWORD_URL: /api/v1/users/updatepassword
        VITE_UPDATEPROFILE_URL: /api/v1/users/updateprofile
        VITE_LOGOUT_USER: /api/v1/users/logout
    container_name: courseselling-frontend
    restart: unless-stopped
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
        reservations:
          cpus: "0.1"
          memory: 64M

  # ---- Nginx Reverse Proxy (SSL termination) ----
  nginx:

    image: nginx:stable-alpine
    container_name: courseselling-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Custom nginx config
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # SSL certificates (managed by certbot)
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on:
      - backend
      - frontend
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
        reservations:
          cpus: "0.1"
          memory: 64M

  # ---- Certbot (SSL certificate manager) ----
  # Run once to obtain certs, then auto-renews via the entrypoint
  certbot:

    image: certbot/certbot
    container_name: courseselling-certbot
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    # Auto-renew every 12 hours
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
        reservations:
          cpus: "0.1"
          memory: 32M

# ---- Shared Network ----
networks:
  app-network:
    driver: bridge

# ---- Named Volumes ----
volumes:
  backend_uploads:
  backend_chunks:
  certbot_conf:
  certbot_www:
