name: coursesellingapp-podman

services:
  #rabbit mq 
  rabbitmq:
    image: docker.io/library/rabbitmq:management-alpine
    container_name: courseselling_rabbitmq
    ports:
      - "15672:15672"
    expose:
      - "5672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - courseselling
    restart: unless-stopped
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  backend:
    image: localhost/courseselling-backend:podman
    container_name: courseselling_backend
    build:
      context: ./backend
      dockerfile: Containerfile.podman
    env_file:
      - ./backend/podman.env.sample
    environment:
      NODE_ENV: production
      PORT: ${PORT:-8080}
    expose:
      - "8080"
    volumes:
      - backend_temp:/app/public/temp
      - backend_chunks:/app/public/chunkPlaylist
    networks:
      - courseselling
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cpus: "1.0"
    mem_limit: 512m
    pids_limit: 256

  worker:
    image: localhost/courseselling-worker:podman
    container_name: courseselling_worker
    build:
      context: ./worker
      dockerfile: Containerfile.podman
    env_file:
      - ./worker/podman.env.sample
    networks:
      - courseselling
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cpus: "1.0"
    mem_limit: 768m
    pids_limit: 256

  frontend:
    image: localhost/courseselling-frontend:podman
    container_name: courseselling_frontend
    build:
      context: ./frontend
      dockerfile: Containerfile.podman
      env_file:
        - ./env.container
      args:
        - VITE_SIGNUP_USER
        - VITE_LOGIN_USER
        - VITE_GOOGLE_USER
        - VITE_AUTHME_URL
        - VITE_COURSE_ADDTOCOMPLETION_URL
        - VITE_COURSE_CHECKCOMPLETION_URL
        - VITE_FINDUSER_URL
        - VITE_UPDATEPASSWORD_URL
        - VITE_UPDATEPROFILE_URL
        - VITE_LOGOUT_USER
        - VITE_CREATEINSTRUCTOR_URL
        - VITE_COURSE_URL
        - VITE_LESSON_URL
        - VITE_GETCOURSE_URL
        - VITE_GETINSTRUCTOR_COURSES_URL
        - VITE_GETCOURSE_LESSONS_URL
        - VITE_ISPRESENT_URL
        - VITE_ADDSUBSCRIPTION_URL
        - VITE_CLOUDNAME
        - VITE_UPLOADPRESET
        - VITE_GOOGLE_CLIENT_ID
        - VITE_CLERK_PUBLISHABLE_KEY
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      - courseselling
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m,mode=0755
      - /var/run:size=8m,mode=0755
    security_opt:
      - no-new-privileges:true
    cpus: "0.5"
    mem_limit: 128m
    pids_limit: 128

networks:
  courseselling:
    driver: bridge

volumes:
  backend_temp:
  backend_chunks:
  rabbitmq_data:
