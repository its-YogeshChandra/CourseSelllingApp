# Lightweight nginx config for the frontend container
# Handles SPA routing - all non-file requests fall back to index.html
server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Serve static assets with caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback - any route that doesn't match a file goes to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
